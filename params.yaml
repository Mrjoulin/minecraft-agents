# Simulation tuning parameters. Code reads these at startup (src/config.js);
# env vars still override where the old config allowed them (MC_*, LLM_*, *_PORT, SESSION_MS, SUNSET_AT_MS).

speech:
  hearing: { whisper: 4, talk: 14, shout: 40 }   # hearing radii in blocks
  order_radius: 6     # orders only count within this distance
  sight_radius: 28    # how far the commander can see evidence

session:
  duration_ms: 450000     # total run length
  sunset_at_ms: 240000    # when the GM starts the sunset
  review_every_ms: 35000  # commander LLM review cadence
  watch_step_ms: 12000    # commander rotates who it watches
  worker_tick_ms: 1000    # worker loop idle tick
  animal_cooldown_ms: 45000
  animal_notice_radius: 16
  memory_size: 14         # worker conversational memory lines

path:
  think_timeout_ms: 8000  # pathfinder A* think budget
  search_radius: 64       # A* search radius (bounds heap blowups)
  skill_timeout_ms: 30000
  log_search_radius: 48
  max_log_height_above_feet: 2
  anchor_distance: 18
  deposit_attempts: 3
  go_near_retries: 2
  retry_settle_ms: 600

observer:
  sample_ms: 1000
  audit_every_ms: 8000
  chop_note_every: 3
  place_note_every: 5

world:
  # Seed 42 (fixed in server/server.properties level-seed) — dry rolling forest plain,
  # camp picked by scripts/survey-seed.js: flattest dry 48x48 patch, ground at y≈70.
  camp:
    pad: [-92, 71, 60]
    chest: [-90, 71, 58]
    fire: [-93, 71, 61]
    hut: [-84, 71, 51]
    table: [-88, 71, 58]
  sunset: { steps: 20, from: 11000, to: 14500 }
  # Oak grove planted around camp each session (dx, dz from the campfire).
  tree_spots: [[-4, -13], [5, -18], [-6, -22], [3, -25], [4, 13], [-5, 18], [6, 22], [-3, 25],
               [14, 1], [18, 5], [22, -6], [25, 3], [-13, 4], [-18, -5], [-22, 6], [-25, -3]]
  # Grazing animals: dx, dz from the campfire, kind.
  pastures: [[14, 3, pig], [15, -2, sheep], [-15, 2, pig], [-14, -3, cow],
             [2, -16, sheep], [-3, -15, pig], [3, 15, cow], [-2, 16, pig]]
